[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dense-forest-monitoring"
version = "0.1.0"
description = "Hybrid spatial-spectral models for scalable remote sensing foundation model experiments."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

