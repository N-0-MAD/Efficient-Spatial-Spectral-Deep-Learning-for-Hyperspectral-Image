experiment:
  name: salinas_independent_band_transformer
  task: hyperspectral_patch_classification
  seed: 42

data:
  dataset: salinas
  patch_size: 15
  train_fraction: 0.1
  num_classes: 16
  bands: 204

model:
  name: independent_band_transformer
  transformer_patch_size: 15
  embed_dim: 64
  depth: 2
  num_heads: 4
  dropout: 0.1

training:
  batch_size: 64
  epochs: 5
  learning_rate: 0.0003
  weight_decay: 0.0001

